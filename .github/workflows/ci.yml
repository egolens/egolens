name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tests
        run: npx vitest run
      - name: Oracle receipt cryptography tests
        run: npm run test:oracle-receipts
      - name: Adapter Amnesia trust-boundary tests
        run: npm run test:adapter-amnesia
      - name: Phase 10 evidence-contract and fresh-process tests
        run: npm run test:phase10-evidence
      - name: Lint (errors block, warnings reported)
        run: npx eslint src
      - name: Build (includes type-check)
        run: npm run build
      - name: Build isolated Adapter Amnesia author workspace
        run: npm run build:amnesia-author
      # The Phase 10 build-boundary scan is a macOS Seatbelt gate that an
      # operator runs from a separate reviewed verifier checkout with an
      # owner-only trust manifest (see benchmarks/phase10/README.md); it is not
      # reproducible on this Linux runner. Only its syntax and schema loading
      # are checked here.
      - name: Phase 10 scripts parse and schemas compile
        run: |
          find scripts -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node -e "import('./scripts/lib/phase10-schema.mjs').then((m) => m.loadPhase10SchemasV1()).then((s) => console.log('schemas', s.schemaHashes.length))"
      - name: Bundle size report
        run: |
          {
            echo "## Bundle size"
            echo ""
            echo "| Asset | Size | Gzip |"
            echo "|---|---|---|"
            for f in dist/assets/*.js; do
              name=$(basename "$f" | sed -E 's/-[A-Za-z0-9_-]{8}\./\./')
              size=$(wc -c < "$f" | awk '{printf "%.1f KB", $1/1024}')
              gzip=$(gzip -c "$f" | wc -c | awk '{printf "%.1f KB", $1/1024}')
              echo "| $name | $size | $gzip |"
            done
            total=$(du -sk dist | cut -f1)
            echo ""
            echo "**Total dist**: ${total} KB"
          } >> "$GITHUB_STEP_SUMMARY"
