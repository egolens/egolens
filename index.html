    <!--
      Google Analytics — anonymous usage metrics (no cookies, no PII) — is set up
      in src/utils/analyticsBootstrap.ts, not here, so the maintainer opt-out can
      read a Vite env var. See that file for why localhost is measured rather
      than excluded.
    -->
    <style>
      /* Cross-browser range slider — teal accent on dark track */
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        background: transparent;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 2px;
        background: #232940;
      }
      input[type="range"]::-moz-range-track {
        height: 4px;
        border-radius: 2px;
        background: #232940;
        border: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #00E89D;
        border: 2px solid #111628;
        margin-top: -5px;
        box-shadow: 0 0 4px rgba(0,232,157,0.4);
      }
      input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #00E89D;
        border: 2px solid #111628;
        box-shadow: 0 0 4px rgba(0,232,157,0.4);
      }
      /* Blue accent variant for trail slider */
      input[type="range"].trail-slider::-webkit-slider-thumb {
        background: #00C9DB;
        box-shadow: 0 0 4px rgba(0,201,219,0.4);
      }
      input[type="range"].trail-slider::-moz-range-thumb {
        background: #00C9DB;
        box-shadow: 0 0 4px rgba(0,201,219,0.4);
      }
    </style>
